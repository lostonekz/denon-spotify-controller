name: CI

# Three independent jobs, deliberately. The architecture gates need nothing
# but Python and must stay fast enough that nobody is tempted to skip them.
# The host tests need only a C compiler. Only the firmware build needs ESP-IDF.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    name: Architecture gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # No pip install step, on purpose: the gates use only the standard
      # library so they cannot break from a dependency change, and so they
      # run identically on any developer machine.
      - name: Run all gates
        run: python tools/run_all_checks.py --root .

      # Tests the tests. A gate that has only ever returned PASS is not
      # evidence -- it may be passing because it is broken. This shows each
      # gate a deliberate violation in a scratch clone and requires it to fail.
      - name: Verify gates actually enforce
        run: python tools/test_gates.py

  host-tests:
    name: Host tests (Unity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S test/host -B build/host -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build/host --parallel
      - name: Test
        run: ctest --test-dir build/host --output-on-failure

  host-tests-sanitizers:
    name: Host tests (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The codecs parse attacker-influenced bytes off a socket. Running the
      # boundary tables under sanitizers is where an off-by-one in the MV
      # parser actually gets caught, rather than in the field.
      - name: Configure
        run: >
          cmake -S test/host -B build/asan
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -g"
      - name: Build
        run: cmake --build build/asan --parallel
      - name: Test
        run: ctest --test-dir build/asan --output-on-failure

  firmware:
    name: Firmware build (ESP-IDF)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The dev signing key protects nothing (docs/SECURITY.md §4) - its only
      # job is keeping the signature-verification path exercised on every
      # build so it cannot silently rot before a production key exists. It is
      # never committed (tools/keys/*.pem is gitignored), so CI generates a
      # fresh, disposable one every run. tools/check_release.py separately
      # proves this key can never reach a production build.
      - name: Generate ephemeral dev signing key
        run: |
          mkdir -p tools/keys
          openssl ecparam -name prime256v1 -genkey -noout \
            -out tools/keys/dev_ota_signing.pem
      - name: Build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5
          target: esp32s3
      # Post-link symbol scan: the CMake REQUIRES boundary constrains headers,
      # not symbols. This is what actually proves no non-ui object references
      # lv_* (docs/adr/0008).
      - name: LVGL symbol boundary (post-link)
        run: python tools/check_lvgl_boundary.py --root . --build-dir build
