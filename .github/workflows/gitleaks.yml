name: gitleaks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Toda segunda-feira às 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  varredura:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar com o histórico inteiro
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Instalar o gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tar="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          somas="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          curl -sSfL -o "$tar" "$base/$tar"
          curl -sSfL -o "$somas" "$base/$somas"
          grep " $tar\$" "$somas" | sha256sum -c -
          tar -xzf "$tar" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Decidir o que varrer
        id: escopo
        env:
          EVENTO: ${{ github.event_name }}
          ANTES: ${{ github.event.before }}
          BASE_PR: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          vazio=0000000000000000000000000000000000000000
          case "$EVENTO" in
            pull_request)
              echo "log_opts=--no-merges $BASE_PR..HEAD" >> "$GITHUB_OUTPUT"
              echo "rotulo=diff do pull request" >> "$GITHUB_OUTPUT"
              ;;
            push)
              if [ -z "${ANTES:-}" ] || [ "$ANTES" = "$vazio" ] || ! git cat-file -e "$ANTES^{commit}" 2>/dev/null; then
                echo "log_opts=--all" >> "$GITHUB_OUTPUT"
                echo "rotulo=histórico inteiro (branch novo ou force-push)" >> "$GITHUB_OUTPUT"
              else
                echo "log_opts=--no-merges $ANTES..${{ github.sha }}" >> "$GITHUB_OUTPUT"
                echo "rotulo=commits deste push" >> "$GITHUB_OUTPUT"
              fi
              ;;
            *)
              echo "log_opts=--all" >> "$GITHUB_OUTPUT"
              echo "rotulo=histórico inteiro (agendado ou manual)" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Varrer
        env:
          LOG_OPTS: ${{ steps.escopo.outputs.log_opts }}
          ROTULO: ${{ steps.escopo.outputs.rotulo }}
        run: |
          set -uo pipefail
          echo "Escopo: $ROTULO  (--log-opts=$LOG_OPTS)"
          gitleaks git . \
            --log-opts="$LOG_OPTS" \
            --no-banner \
            --redact \
            --verbose
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::gitleaks achou segredo. Se for falso positivo, ajustar .gitleaks.toml."
          fi
          exit "$status"
