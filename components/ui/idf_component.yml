dependencies:
  idf: ">=5.0"
  # Pinned to an EXACT version, deliberately not a caret range -- RISKS.md
  # R9: "LVGL version drift... mitigation: exact patch pin in
  # dependencies.lock." svc_artwork's own esp_jpeg dependency uses a caret
  # range ("^1.3.1"); that precedent is NOT repeated here on purpose, R9
  # specifically calls this risk out for LVGL by name (a v8->v9 upgrade was
  # already a breaking change once). 9.5.0 is the current release on the
  # ESP Component Registry as of this pin.
  lvgl/lvgl: "9.5.0"
